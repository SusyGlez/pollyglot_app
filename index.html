<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>PollyGlot</title>
  </head>
  <body class="m-auto h-dvh max-w-md">
    <header
      class="bg-[#0D182E] h-60 flex justify-center bg-[url(./images/world_map.png)] bg-no-repeat bg-cover"
    >
      <div class="flex justify-center flex-row m-auto gap-2.5 items-center">
        <img src="./images/parrot.png" />
        <div class="flex flex-col gap-1">
          <h1
            class="font-[Big_Shoulders] text-[#32CD32] font-extrabold text-5xl"
          >
            PollyGlot
          </h1>
          <p class="font-[outfit] text-white">Perfect Translation Every Time</p>
        </div>
      </div>
    </header>
    <main
      class="font-[outfit] font-bold border-[#252F42] border-4 mx-2.5 my-7 rounded-2xl p-5 flex flex-col justify-center text-center text-2xl gap-8"
    >
      <form id="translate-form" class="flex flex-col">
        <h2 class="text-[#035A9D] mb-5">Text to translate</h2>
        <textarea
          id="user-input"
          placeholder="How are you?"
          class="bg-[#EFF0F4] rounded-2xl h-32 text-black p-2.5 mb-6"
        ></textarea>
        <h3 class="text-[#035A9D] mb-5">Select Language</h3>
        <div class="flex items-start flex-col mx-14 mb-6">
          <div class="flex gap-4">
            <input type="radio" id="en-gb" value="en-GB" name="language" />
            <label for="en-gb">English 🇬🇧</label><br />
          </div>
          <div class="flex gap-4">
            <input type="radio" id="es-mx" value="es-MX" name="language" />
            <label for="es-mx">Spanish 🇲🇽</label><br />
          </div>
          <div class="flex gap-4">
            <input type="radio" id="sv" value="sv" name="language" />
            <label for="sv">Swedish 🇸🇪</label><br />
          </div>
        </div>
        <button
          id="translate-btn"
          class="bg-[#035A9D] text-white text-3xl h-14 rounded-xl w-full"
          type="submit"
        >
          Translate
        </button>
      </form>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
