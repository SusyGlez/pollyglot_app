<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>PollyGlot</title>
  </head>
  <body class="m-auto h-dvh max-w-md">
    <header
      class="bg-[#0D182E] h-80 flex justify-center bg-[url(./images/world_map.png)] bg-no-repeat bg-contain"
    >
      <div class="flex justify-center flex-row m-auto gap-2.5 items-center">
        <img src="./images/parrot.png" class="" />
        <div class="flex flex-col gap-1">
          <h1
            class="font-[Big_Shoulders] text-[#32CD32] font-extrabold text-5xl"
          >
            PollyGlot
          </h1>
          <p class="font-[outfit] text-white">Perfect Translation Every Time</p>
        </div>
      </div>
    </header>
    <div
      class="font-[outfit] font-bold border-[#252F42] border-4 mx-2.5 my-7 rounded-2xl p-5 flex flex-col justify-center text-center text-2xl gap-8"
    >
      <h2 class="text-[#035A9D]">Text to translate</h2>
      <textarea
        placeholder="How are you?"
        class="bg-[#EFF0F4] rounded-2xl h-32 text-black p-2.5"
      ></textarea>
      <h3 class="text-[#035A9D]">Select Language</h3>
      <div class="flex items-start flex-col mx-14">
        <div class="flex gap-4">
          <input type="radio" id="en-gb" name="language" />
          <label for="en-gb">English 🇬🇧</label><br />
        </div>
        <div class="flex gap-4">
          <input type="radio" id="es-mx" name="language" />
          <lable for="es-mx">Spanish 🇲🇽</lable><br />
        </div>
        <div class="flex gap-4">
          <input type="radio" id="sv" name="language" />
          <label for="sv">Swedish 🇸🇪</label><br />
        </div>
      </div>
      <button class="bg-[#035A9D] text-white text-3xl h-14">Translate</button>
    </div>
    <script src="index.js" type="module"></script>
  </body>
</html>
