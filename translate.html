<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>PollyGlot</title>
  </head>
  <body class="m-auto h-dvh max-w-md flex flex-col overflow-hidden">
    <header
      class="shrink-0 bg-[#0D182E] h-80 flex justify-center bg-[url(./images/world_map.png)] bg-no-repeat bg-contain"
    >
      <div class="flex justify-center flex-row m-auto gap-2.5 items-center">
        <img src="./images/parrot.png" class="" />
        <div class="flex flex-col gap-1">
          <h1
            class="font-[Big_Shoulders] text-[#32CD32] font-extrabold text-5xl"
          >
            PollyGlot
          </h1>
          <p class="font-[outfit] text-white">Perfect Translation Every Time</p>
        </div>
      </div>
    </header>
    <main
      class="font-[outfit] font-bold border-[#252F42] border-4 mx-2.5 my-7 rounded-2xl p-5 flex flex-col gap-4 flex-1 overflow-hidden"
    >
      <div
        id="chat-window"
        class="flex flex-col gap-3 overflow-y-auto flex-1 min-h-0"
      >
        <div
          class="bg-[#035A9D] text-white rounded-2xl p-4 text-left text-lg self-end max-w-[85%]"
        >
          Select the language you want to translate into, type your text and hit
          send!
        </div>
      </div>

      <form id="translate-form" class="flex gap-2">
        <input
          type="text"
          id="user-input"
          placeholder="Type here..."
          class="flex-1 bg-[#EFF0F4] rounded-2xl text-black p-2.5 text-lg"
        />
        <button
          id="translate-btn"
          type="submit"
          class="bg-[#035A9D] text-white rounded-2xl px-4"
        >
          ➤
        </button>
      </form>

      <div class="flex justify-center gap-4">
        <button
          type="button"
          class="flag-btn text-3xl rounded-lg p-1"
          data-lang="en-GB"
        >
          🇬🇧
        </button>
        <button
          type="button"
          class="flag-btn text-3xl rounded-lg p-1"
          data-lang="es-MX"
        >
          🇲🇽
        </button>
        <button
          type="button"
          class="flag-btn text-3xl rounded-lg p-1"
          data-lang="sv"
        >
          🇸🇪
        </button>
      </div>
    </main>
    <script src="translate.js" type="module"></script>
  </body>
</html>
